<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Redefinir senha — Garrafix MG</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="robots"
    content="noindex, nofollow"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: Arial, sans-serif;
      background: #0B5E2B;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px;

      background: #FFFFFF;
      border-radius: 12px;
      text-align: center;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 10px;
      color: #0B5E2B;
      font-size: 26px;
    }

    p {
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;

      color: #333333;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;

      border: 1px solid #CCCCCC;
      border-radius: 8px;

      font-size: 16px;
    }

    input:focus {
      border-color: #0B5E2B;
      outline: 2px solid rgba(11, 94, 43, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 8px;

      background: #0B5E2B;
      color: #FFFFFF;

      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      background: #999999;
    }

    .password-rules {
      margin: 8px 0 18px;
      color: #555555;
      font-size: 13px;
      text-align: left;
    }

    .msg {
      min-height: 20px;
      margin-top: 16px;
      font-size: 14px;
    }

    .error {
      color: #B00020;
    }

    .success {
      color: #087A35;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Redefinir senha</h1>

    <p id="status" aria-live="polite">
      Verificando o link de recuperação...
    </p>

    <form id="form" class="hidden" novalidate>
      <div class="form-group">
        <label for="password">Nova senha</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Digite a nova senha"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm">Confirmar nova senha</label>

        <input
          type="password"
          id="confirm"
          name="confirm"
          placeholder="Repita a nova senha"
          autocomplete="new-password"
          minlength="8"
          required
        />
      </div>

      <p class="password-rules">
        A senha deve ter pelo menos 8 caracteres e conter letras,
        números e um caractere especial.
      </p>

      <button type="submit" id="btn">
        Atualizar senha
      </button>
    </form>

    <p
      id="msg"
      class="msg"
      role="status"
      aria-live="polite"
    ></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://vppzpfoqmhjsynusyitx.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_T7AEj7zSK62iKDYQTWeIeQ_NM8hbY15';

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const statusElement = document.getElementById('status');
    const formElement = document.getElementById('form');
    const messageElement = document.getElementById('msg');
    const buttonElement = document.getElementById('btn');
    const passwordElement = document.getElementById('password');
    const confirmElement = document.getElementById('confirm');

    let isProcessing = false;
    let recoveryDetected = false;

    function showMessage(text, type) {
      messageElement.innerText = text;
      messageElement.className = `msg ${type}`;
    }

    function clearMessage() {
      messageElement.innerText = '';
      messageElement.className = 'msg';
    }

    function showRecoveryForm() {
      recoveryDetected = true;

      statusElement.innerText =
        'Digite e confirme sua nova senha.';

      formElement.classList.remove('hidden');

      setTimeout(() => {
        passwordElement.focus();
      }, 100);
    }

    function showInvalidLink() {
      formElement.classList.add('hidden');

      statusElement.innerText =
        'Link inválido ou expirado.';

      showMessage(
        'Solicite um novo link de recuperação de senha pelo aplicativo.',
        'error'
      );
    }

    function setLoading(loading) {
      isProcessing = loading;
      buttonElement.disabled = loading;
      buttonElement.innerText = loading
        ? 'Atualizando...'
        : 'Atualizar senha';
    }

    function validatePassword(password) {
      const hasLetter = /[a-zA-Z]/.test(password);
      const hasNumber = /\d/.test(password);
      const hasSpecialCharacter =
        /[!@#$%^&*(),.?":{}|<>_\-+=;'/\\[\]`~]/.test(password);

      if (password.length < 8) {
        return 'A senha deve ter pelo menos 8 caracteres.';
      }

      if (!hasLetter) {
        return 'A senha deve conter pelo menos uma letra.';
      }

      if (!hasNumber) {
        return 'A senha deve conter pelo menos um número.';
      }

      if (!hasSpecialCharacter) {
        return 'A senha deve conter pelo menos um caractere especial.';
      }

      return null;
    }

    function urlIndicatesRecovery() {
      const hash = window.location.hash;
      const query = window.location.search;

      return (
        hash.includes('type=recovery') ||
        hash.includes('access_token=') ||
        query.includes('type=recovery') ||
        query.includes('code=')
      );
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        showRecoveryForm();
      }
    });

    async function checkRecoverySession() {
      try {
        const {
          data: { session },
          error
        } = await supabaseClient.auth.getSession();

        if (error) {
          console.error(
            '[RESET PASSWORD] Erro ao validar sessão:',
            error.message
          );

          showInvalidLink();
          return;
        }

        /*
         * Alguns fluxos do Supabase podem criar a sessão antes de
         * disparar o evento PASSWORD_RECOVERY. Nesse caso, aceitamos
         * a sessão somente quando a própria URL indica recuperação.
         */
        if (session && urlIndicatesRecovery()) {
          showRecoveryForm();
          return;
        }

        setTimeout(() => {
          if (!recoveryDetected) {
            showInvalidLink();
          }
        }, 1200);
      } catch (error) {
        console.error(
          '[RESET PASSWORD] Erro inesperado:',
          error
        );

        statusElement.innerText =
          'Não foi possível validar o link.';

        showMessage(
          'Tente novamente mais tarde ou solicite um novo link.',
          'error'
        );
      }
    }

    async function updatePassword(event) {
      event.preventDefault();

      if (isProcessing) {
        return;
      }

      clearMessage();

      const password = passwordElement.value;
      const confirmation = confirmElement.value;

      if (!password || !confirmation) {
        showMessage(
          'Preencha os dois campos.',
          'error'
        );

        return;
      }

      const passwordError = validatePassword(password);

      if (passwordError) {
        showMessage(passwordError, 'error');
        return;
      }

      if (password !== confirmation) {
        showMessage(
          'As senhas não coincidem.',
          'error'
        );

        return;
      }

      try {
        setLoading(true);

        const { error } =
          await supabaseClient.auth.updateUser({
            password
          });

        if (error) {
          console.error(
            '[RESET PASSWORD] Erro ao atualizar senha:',
            error.message
          );

          showMessage(
            'Não foi possível atualizar a senha. Solicite um novo link e tente novamente.',
            'error'
          );

          setLoading(false);
          return;
        }

        statusElement.innerText =
          'Senha atualizada com sucesso!';

        showMessage(
          'Você já pode entrar no aplicativo usando a nova senha.',
          'success'
        );

        formElement.classList.add('hidden');

        await supabaseClient.auth.signOut();

        /*
         * Remove tokens e códigos de recuperação da URL,
         * evitando que permaneçam no histórico do navegador.
         */
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      } catch (error) {
        console.error(
          '[RESET PASSWORD] Erro inesperado:',
          error
        );

        showMessage(
          'Erro inesperado. Tente novamente.',
          'error'
        );

        setLoading(false);
      }
    }

    formElement.addEventListener(
      'submit',
      updatePassword
    );

    checkRecoverySession();
  </script>
</body>
</html>
